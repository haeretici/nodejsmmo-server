# Engine PHP vhosts — HTTP :80. Node game stays 127.0.0.1:8081 (not a vhost).
#
# /etc/hosts:
#   127.0.0.1 www.example.com editor.example.com manage.example.com
#
# | Host                | Folder              | Access                         |
# | www.example.com       | frontend/           | public on this box (accounts + /play) |
# | editor.example.com    | map-editor/         | loopback only                  |
# | manage.example.com    | content-manager/    | loopback only                  |
#
# PHP: frontend, map-editor, content-manager. Only server/ is Node.
# Play is www.example.com/play (same-origin). Do not add a play vhost until asked.
# Frontend stays this thin front controller until a later Symfony conversion (do not start here).
#
# Enable (needs root):
#   sudo a2enmod rewrite headers proxy proxy_http proxy_wstunnel
#   sudo ln -sf /var/www/mmo/server/server_settings/apache/vhost.conf \
#        /etc/apache2/sites-available/engine.conf
#   sudo a2ensite engine.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Collision: /etc/apache2/sites-enabled/example.conf has ServerAlias *.example.com → /var/www/mit/public
# (other product). Exact ServerName below wins for these three names. Do not add *.example.com here.
# Do not point DocumentRoot at HuntDL kernel/, php/, or server/.
#
# Optional later: TLS :443, HTTP auth on editor/manage if they leave loopback.

Define ENGINE_ROOT /var/www/mmo
Define ENGINE_GAME_WS ws://127.0.0.1:8081/v1/ws

# --- shared filesystem denies (HTTP only; PHP can still read content/ from disk) ---

<DirectoryMatch "^/var/www/mmo/.*/\.git">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/mmo/(frontend|map-editor|content-manager)/(config|php|tests|src|bin|node_modules|vendor)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/mmo/(server|content|kernel|legacy|presets)(/|$)">
    Require all denied
</DirectoryMatch>

# Dotfiles / overlay / agent files: denied inside each app Directory below.

# =============================================================================
# www.example.com — public frontend (accounts + /play). Thin PHP. Later: Symfony.
# /v1 REST stays PHP→Node. /v1/ws is Apache→Node (PHP cannot proxy WebSocket).
# =============================================================================
<VirtualHost *:80>
    ServerName www.example.com
    ServerAdmin webmaster@localhost

    DocumentRoot ${ENGINE_ROOT}/frontend
    DirectoryIndex index.php
    UseCanonicalName On

    ErrorLog ${APACHE_LOG_DIR}/engine-www-error.log
    CustomLog ${APACHE_LOG_DIR}/engine-www-access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always unset X-Powered-By
    </IfModule>

    <IfModule php_module>
        php_flag expose_php Off
        php_flag display_errors Off
        php_value variables_order "GPCS"
    </IfModule>

    LimitRequestBody 65536
    Timeout 60

    <Directory ${ENGINE_ROOT}/frontend>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        <FilesMatch "(?i)^(settings\.local\.json|\.env|\.htpasswd|AGENTS\.md|package(-lock)?\.json|composer\.(json|lock))$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory ${ENGINE_ROOT}/frontend/static>
        FallbackResource disabled
        <IfModule php_module>
            php_flag engine Off
        </IfModule>
        <FilesMatch "\.(php|phtml|phar|shtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_proxy_wstunnel.c>
        ProxyRequests Off
        ProxyPreserveHost Off
        <Location /v1/ws>
            ProxyPass ${ENGINE_GAME_WS}
            ProxyPassReverse ${ENGINE_GAME_WS}
        </Location>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/css application/javascript text/javascript application/json
    </IfModule>
</VirtualHost>

# =============================================================================
# editor.example.com — map-editor. Loopback only. allowRemote stays false in PHP.
# =============================================================================
<VirtualHost *:80>
    ServerName editor.example.com
    ServerAdmin webmaster@localhost

    DocumentRoot ${ENGINE_ROOT}/map-editor
    DirectoryIndex index.php
    UseCanonicalName On

    ErrorLog ${APACHE_LOG_DIR}/engine-editor-error.log
    CustomLog ${APACHE_LOG_DIR}/engine-editor-access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always unset X-Powered-By
    </IfModule>

    <IfModule php_module>
        php_flag expose_php Off
        php_flag display_errors Off
        php_value variables_order "GPCS"
        php_value post_max_size 32M
        php_value upload_max_filesize 32M
    </IfModule>

    LimitRequestBody 33554432
    Timeout 60

    <Directory ${ENGINE_ROOT}/map-editor>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride None
        Require local
        DirectoryIndex index.php
        FallbackResource /index.php
        <FilesMatch "(?i)^(settings\.local\.json|\.env|\.htpasswd|AGENTS\.md|package(-lock)?\.json|composer\.(json|lock))$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory ${ENGINE_ROOT}/map-editor/static>
        FallbackResource disabled
        <IfModule php_module>
            php_flag engine Off
        </IfModule>
        <FilesMatch "\.(php|phtml|phar|shtml)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>

# =============================================================================
# manage.example.com — content-manager (PHP). Loopback only. allowRemote stays false.
# =============================================================================
<VirtualHost *:80>
    ServerName manage.example.com
    ServerAdmin webmaster@localhost

    DocumentRoot ${ENGINE_ROOT}/content-manager
    DirectoryIndex index.php
    UseCanonicalName On

    ErrorLog ${APACHE_LOG_DIR}/engine-manage-error.log
    CustomLog ${APACHE_LOG_DIR}/engine-manage-access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "no-referrer"
        Header always unset X-Powered-By
    </IfModule>

    <IfModule php_module>
        php_flag expose_php Off
        php_flag display_errors Off
        php_value variables_order "GPCS"
    </IfModule>

    LimitRequestBody 262144
    Timeout 60

    <Directory ${ENGINE_ROOT}/content-manager>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride None
        Require local
        DirectoryIndex index.php
        FallbackResource /index.php
        <FilesMatch "(?i)^(settings\.local\.json|\.env|\.htpasswd|AGENTS\.md|package(-lock)?\.json|composer\.(json|lock))$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory ${ENGINE_ROOT}/content-manager/static>
        FallbackResource disabled
        <IfModule php_module>
            php_flag engine Off
        </IfModule>
        <FilesMatch "\.(php|phtml|phar|shtml)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
